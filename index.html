
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>AREC GEO | Visor Territorial 3D</title>

  <!-- CesiumJS -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.146/Build/Cesium/Cesium.js"></script>

  <link rel="stylesheet"
        href="https://cesium.com/downloads/cesiumjs/releases/1.146/Build/Cesium/Widgets/widgets.css">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #cesiumContainer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .panel {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 100;

      width: 280px;
      max-width: calc(100vw - 65px);

      background: rgba(12, 22, 35, 0.94);
      color: white;

      padding: 18px;
      border-radius: 10px;

      box-shadow: 0 4px 18px rgba(0,0,0,0.25);
    }

    .panel h1 {
      font-size: 23px;
      margin: 0 0 8px;
      font-weight: bold;
    }

    .panel p {
      font-size: 12px;
      line-height: 1.6;
      color: #d5dee8;
      margin: 6px 0;
    }

    .subtitulo {
      margin-bottom: 4px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: bold;
    }

    select {
      width: 100%;
      padding: 11px;

      border-radius: 6px;
      border: 1px solid #728396;

      background: #ffffff;
      color: #142131;

      font-size: 14px;
      cursor: pointer;
    }

    select:focus {
      outline: 2px solid #58a6ff;
      outline-offset: 2px;
    }

    .estado {
      margin-top: 13px;
      margin-bottom: 10px;
      font-size: 12px;
      color: #a9d5ff;
      line-height: 1.5;
    }

    .separador {
      height: 1px;
      margin: 14px 0;
      background: rgba(255,255,255,0.15);
    }

    .nota {
      font-size: 11px;
      color: #aab6c5;
    }

    @media (max-width: 600px) {
      .panel {
        top: 10px;
        left: 10px;
        width: 250px;
        padding: 14px;
      }

      .panel h1 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- VISOR 3D -->
  <div id="cesiumContainer"></div>

  <!-- PANEL PRINCIPAL -->
  <div class="panel">

    <h1>AREC GEO</h1>

    <p class="subtitulo">
      Visor de inteligencia territorial 3D
    </p>

    <p>
      18 plazas oficiales · Grupo RUBA
    </p>

    <label for="plaza">
      Seleccionar plaza
    </label>

    <select id="plaza"></select>

    <div class="estado" id="estado">
      Preparando visor...
    </div>

    <div class="separador"></div>

    <p>
      Navega, acerca, gira e inclina
      el mapa para explorar el territorio.
    </p>

    <p class="nota">
      Versión demostrativa 3D.
      Capas territoriales en preparación.
    </p>

  </div>

  <script>

    // ===========================================
    // 1. CONFIGURACIÓN GENERAL
    // ===========================================

    const CONFIG = {
      alturaEnfoque: 55000,
      inclinacion: -55,
      duracionVuelo: 2.0
    };


    // ===========================================
    // 2. CREACIÓN DEL VISOR CESIUM
    // ===========================================

    const viewer = new Cesium.Viewer(
      "cesiumContainer",
      {
        baseLayer: new Cesium.ImageryLayer(
          new Cesium.OpenStreetMapImageryProvider({
            url: "https://tile.openstreetmap.org/",
            maximumLevel: 18
          })
        ),

        terrainProvider:
          new Cesium.EllipsoidTerrainProvider(),

        baseLayerPicker: false,
        geocoder: false,
        animation: false,
        timeline: false,
        navigationHelpButton: true,

        homeButton: true,
        sceneModePicker: true,
        fullscreenButton: true,

        selectionIndicator: true,
        infoBox: true
      }
    );


    // ===========================================
    // 3. CATÁLOGO DE LAS 18 PLAZAS
    // ===========================================

    // Coordenadas de referencia urbana.
    // Formato: [Nombre, Longitud, Latitud]
    // Delicias no se incluye.

    const PLAZAS = {

      JRZ: [
        "Ciudad Juárez",
        -106.4245,
        31.6904
      ],

      CHH: [
        "Chihuahua",
        -106.0691,
        28.6320
      ],

      SLT: [
        "Saltillo",
        -100.9950,
        25.4232
      ],

      TOR: [
        "Torreón",
        -103.4068,
        25.5428
      ],

      MTY: [
        "Monterrey",
        -100.3161,
        25.6866
      ],

      HMO: [
        "Hermosillo",
        -110.9559,
        29.0729
      ],

      OBR: [
        "Ciudad Obregón",
        -109.9408,
        27.4864
      ],

      MXL: [
        "Mexicali",
        -115.4523,
        32.6245
      ],

      TIJ: [
        "Tijuana",
        -117.0382,
        32.5149
      ],

      GDL: [
        "Guadalajara",
        -103.3496,
        20.6597
      ],

      QRO: [
        "Querétaro",
        -100.3899,
        20.5888
      ],

      VER: [
        "Veracruz",
        -96.1342,
        19.1738
      ],

      LEO: [
        "León",
        -101.6840,
        21.1220
      ],

      PUE: [
        "Puebla",
        -98.2063,
        19.0414
      ],

      TOL: [
        "Toluca",
        -99.6557,
        19.2826
      ],

      CAN: [
        "Cancún",
        -86.8515,
        21.1619
      ],

      SLP: [
        "San Luis Potosí",
        -100.9855,
        22.1565
      ],

      AGS: [
        "Aguascalientes",
        -102.2916,
        21.8853
      ]

    };


    // ===========================================
    // 4. ELEMENTOS DE INTERFAZ
    // ===========================================

    const selector =
      document.getElementById("plaza");

    const estado =
      document.getElementById("estado");


    // ===========================================
    // 5. CREAR SELECTOR AUTOMÁTICAMENTE
    // ===========================================

    for (const [codigo, datos] of
      Object.entries(PLAZAS)) {

      const opcion =
        document.createElement("option");

      opcion.value = codigo;

      opcion.textContent =
        `${datos[0]} (${codigo})`;

      selector.appendChild(opcion);

    }


    // ===========================================
    // 6. CÁMARA CORREGIDA
    // CENTRAR LA CIUDAD EN PANTALLA
    // ===========================================

    function irAPlaza(codigo) {

      const datos = PLAZAS[codigo];

      if (!datos) {
        estado.textContent =
          "No se encontró la plaza.";
        return;
      }

      const nombre = datos[0];
      const longitud = datos[1];
      const latitud = datos[2];

      estado.textContent =
        `Explorando: ${nombre}`;

      // Punto real que la cámara debe mirar.
      const centro = Cesium.Cartesian3.fromDegrees(
        longitud,
        latitud,
        0
      );

      // Esfera centrada en la ciudad.
      const objetivo = new Cesium.BoundingSphere(
        centro,
        1
      );

      // La cámara se coloca respecto del objetivo,
      // no respecto de una altura vertical fija.
      const orientacion = new Cesium.HeadingPitchRange(
        0,
        Cesium.Math.toRadians(
          CONFIG.inclinacion
        ),
        CONFIG.alturaEnfoque
      );

      viewer.camera.flyToBoundingSphere(
        objetivo,
        {
          offset: orientacion,
          duration: CONFIG.duracionVuelo
        }
      );

    }


    // ===========================================
    // 7. CAMBIO DE PLAZA
    // ===========================================

    selector.addEventListener(
      "change",
      function() {
        irAPlaza(selector.value);
      }
    );


    // ===========================================
    // 8. BOTÓN HOME
    // REGRESAR A CIUDAD JUÁREZ
    // ===========================================

    viewer.homeButton.viewModel.command.beforeExecute
      .addEventListener(function(evento) {

        evento.cancel = true;

        selector.value = "JRZ";
        irAPlaza("JRZ");

      });


    // ===========================================
    // 9. ARRANQUE DEL VISOR
    // ===========================================

    selector.value = "JRZ";

    irAPlaza("JRZ");

  </script>

</body>
</html>
