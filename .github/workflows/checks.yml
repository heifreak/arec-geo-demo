name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run build:preview && git diff --exit-code -- preview.html src/viewer.bundle.js
      - run: node --check src/app.js && node --check src/layers.js && node --check src/providers.js && node --check src/measurements.js

  spatial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --only-binary=:all: -r processing/requirements.txt
      - run: python -m unittest discover -s processing/tests -v
